apiVersion: apps/v1
kind: Deployment
metadata:
  name:  book
  namespace: skills-concert
  labels:
    app:  book
spec:
  selector:
    matchLabels:
      app: book
  strategy:
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app:  book
    spec:
      nodeSelector:
        eks.amazonaws.com/nodegroup: app-ng
      serviceAccountName: book
      containers:
      - name:  book
        image: 554949496620.dkr.ecr.us-east-1.amazonaws.com/book:v1
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 1
            memory: 1024Mi
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - |
                curl -f http://localhost:8080/health || exit 1
          initialDelaySeconds: 5
          timeoutSeconds: 30
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - |
                curl -f http://localhost:8080/health || exit 1
          initialDelaySeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        ports:
        - containerPort: 8080
          name:  book          
      restartPolicy: Always
---
