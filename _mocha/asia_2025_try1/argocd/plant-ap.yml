apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plant-ap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 471208936033.dkr.ecr.ap-northeast-2.amazonaws.com
    chart: microservice
    targetRevision: 0.4.0                          
    helm:
      values: |
        replicaCount: 2

        image:
          repository: 471208936033.dkr.ecr.ap-northeast-2.amazonaws.com/plant
          # This sets the pull policy for images.
          pullPolicy: IfNotPresent
          # Overrides the image tag whose default is the chart appVersion.
          tag: "v1"

        # This is to override the chart name.
        nameOverride: ""
        fullnameOverride: ""

        serviceAccount:
          create: false
          automount: true
          name: "plant"

        service:
          annotations:
            alb.ingress.kubernetes.io/healthcheck-path: /health
            alb.ingress.kubernetes.io/healthcheck-port: "8080"
            alb.ingress.kubernetes.io/success-codes: "200"
            alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=60
          type: ClusterIP
          port: 8080

        ingress:
          enabled: true
          className: "alb"
          annotations:
            alb.ingress.kubernetes.io/load-balancer-name: green-v2
            alb.ingress.kubernetes.io/scheme: internet-facing
            alb.ingress.kubernetes.io/target-type: ip
            alb.ingress.kubernetes.io/healthcheck-interval-seconds: "5"
            alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "2"
            alb.ingress.kubernetes.io/healthy-threshold-count: "2"
            alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
            alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=60
            alb.ingress.kubernetes.io/actions.response-403: >
              {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"403","messageBody":"403 error text"}}

          hosts:
            - host: ""
              paths:
                - path: /plant
                  pathType: Prefix
              

                - path: /grow
                  pathType: Prefix
                  serviceName: grow-ap-microservice
                  servicePort: 8080

        resources:
          limits:
            cpu: 1
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 100Mi

        livenessProbe:
          httpGet:
            path: /health
            port: http
        readinessProbe:
          httpGet:
            path: /health
            port: http

        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 5
          targetCPUUtilizationPercentage: 80


  destination:
    server: https://8FDDAB59762393E7FA635CCDECB930E3.yl4.ap-northeast-2.eks.amazonaws.com  
    namespace: green-tree
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]