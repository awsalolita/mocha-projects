kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-0b55b92556f847edc
  directoryPerms: "700"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-claim
  namespace: app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "efs-sc"
  resources:
    requests:
      storage: 5Gi
