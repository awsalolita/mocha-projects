apiVersion: apps/v1
kind: Deployment
metadata:
  name:  worker
  namespace: astra
  labels:
    app:  worker
spec:
  selector:
    matchLabels:
      app: worker
  strategy:
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app:  worker
    spec:
      serviceAccountName: worker
      containers:
      - name:  worker
        image: 590183988289.dkr.ecr.us-east-1.amazonaws.com/astra-worker:v1
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "10"]
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 1024Mi
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - |
                curl -f http://localhost:8080/health || exit 1
          initialDelaySeconds: 5
          timeoutSeconds: 30
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - |
                curl -f http://localhost:8080/health || exit 1
          initialDelaySeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        env:
        - name: REGISTRY_TABLE_NAME
          value: titanflow-astra-worker-registry

        - name: FLOOR_SECRET_NAME
          value: titanflow-astra-floor-secret

        - name: REGISTER_INTERVAL_S
          value: "2"

        - name: WORKER_ID
          value: ""

        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name

        # Pod namespace
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace

        # Pod IP
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        # Node name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        ports:
        - containerPort: 8080
          name:  worker          
      restartPolicy: Always
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: astra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: astra
spec:
  clusterIP: None
  selector:
    app: worker
  type: ClusterIP
  ports:
  - name: worker
    protocol: TCP
    port: 8080
    targetPort: 8080
