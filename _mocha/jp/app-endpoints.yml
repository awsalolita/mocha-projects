AWSTemplateFormatVersion: '2010-09-09'
Description: VPC Endpoints architecture defining Interface endpoints by subnet and Gateway endpoints by route table.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Target VPC ID where endpoints will be created.

  InterfaceSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs used for deploying Interface-type endpoints.

  EndpointSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group attached to Interface endpoints allowing inbound HTTPS (443) from the VPC.

Resources:

  # ==========================================
  # INTERFACE ENDPOINTS (Attached to Subnets)
  # ==========================================
  SSMInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      SubnetIds: !Ref InterfaceSubnetIds
      SecurityGroupIds: 
        - !Ref EndpointSecurityGroupId
      PrivateDnsEnabled: true

  SSMMessagesInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssmmessages"
      SubnetIds: !Ref InterfaceSubnetIds
      SecurityGroupIds: 
        - !Ref EndpointSecurityGroupId
      PrivateDnsEnabled: true

  EC2MessagesInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2messages"
      SubnetIds: !Ref InterfaceSubnetIds
      SecurityGroupIds: 
        - !Ref EndpointSecurityGroupId
      PrivateDnsEnabled: true
